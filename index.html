<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion || window.framerMotion || { motion: { div: 'div', h1: 'h1', nav: 'nav', section: 'section', p: 'p', a: 'a', button: 'button' }, AnimatePresence: React.Fragment };

    const FloatingParticlesBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          initParticles();
        };

        window.addEventListener('resize', handleResize);

        const particleCount = Math.min(Math.floor((width * height) / 9500), 110);
        let particles = [];

        const colors = [
          'rgba(255, 255, 255, ',   // Bright glowing white
          'rgba(220, 220, 220, ',   // Silver white
          'rgba(160, 160, 160, ',   // Medium gray
          'rgba(100, 100, 100, '    // Dark gray
        ];

        const initParticles = () => {
          particles = [];
          for (let i = 0; i < particleCount; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              radius: Math.random() * 2.2 + 0.6,
              colorPrefix: colors[Math.floor(Math.random() * colors.length)],
              baseAlpha: Math.random() * 0.45 + 0.15,
              vx: (Math.random() - 0.5) * 0.35,
              vy: (Math.random() - 0.5) * 0.35 - 0.1,
              pulseSpeed: Math.random() * 0.015 + 0.005,
              pulseAngle: Math.random() * Math.PI * 2
            });
          }
        };

        initParticles();

        let mouse = { x: -1000, y: -1000 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            p.x += p.vx;
            p.y += p.vy;

            p.pulseAngle += p.pulseSpeed;
            const currentAlpha = Math.max(0.08, p.baseAlpha + Math.sin(p.pulseAngle) * 0.22);

            if (p.x < -10) p.x = width + 10;
            if (p.x > width + 10) p.x = -10;
            if (p.y < -10) p.y = height + 10;
            if (p.y > height + 10) p.y = -10;

            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 130) {
              const force = (130 - dist) / 130;
              p.x -= (dx / dist) * force * 1.2;
              p.y -= (dy / dist) * force * 1.2;
            }

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const pdx = p.x - p2.x;
              const pdy = p.y - p2.y;
              const pdist = Math.sqrt(pdx * pdx + pdy * pdy);

              if (pdist < 105) {
                const lineAlpha = (1 - pdist / 105) * 0.15 * currentAlpha;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(255, 255, 255, ${lineAlpha})`;
                ctx.lineWidth = 0.75;
                ctx.stroke();
              }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `${p.colorPrefix}${currentAlpha})`;
            ctx.shadowBlur = p.radius > 1.8 ? 8 : 0;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.fill();
            ctx.shadowBlur = 0;
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <div className="fixed inset-0 z-0 pointer-events-none overflow-hidden bg-[#0c0c0c]">
          <div 
            className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[500px] rounded-full blur-[140px] opacity-15 pointer-events-none"
            style={{ background: 'radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.05) 50%, transparent 80%)' }}
          />
          <div 
            className="absolute bottom-1/3 left-1/3 w-[500px] h-[400px] rounded-full blur-[160px] opacity-10 pointer-events-none"
            style={{ background: 'radial-gradient(circle, rgba(200,200,200,0.2) 0%, transparent 70%)' }}
          />
          <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block" />
          <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60 pointer-events-none" />
        </div>
      );
    };

    const LogoMark = ({ className = "w-8 h-8" }) => (
      <svg className={className} viewBox="0 0 256 256" fill="white">
        <path d="M 0 128 C 70.692 128 128 185.308 128 256 L 64 256 C 64 220.654 35.346 192 0 192 Z M 256 192 C 220.654 192 192 220.654 256 128 L 128 256 C 128 185.308 185.308 128 256 128 Z M 128 0 C 128 70.692 70.692 128 0 128 L 0 64 C 35.346 64 64 35.346 64 0 Z M 192 0 C 192 35.346 220.654 64 256 64 L 256 128 C 185.308 128 128 70.692 128 0 Z" />

    const ChevronRightIcon = ({ className = "w-4 h-4" }) => (

            {/* Mobile Right: Menu Icon Button */}
            <div className="md:hidden">
              <button

              >
                <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-4 h-4"></i>
              </button>
            </div>
          </nav>

          {/* Mobile Menu Overlay */}
          {mobileMenuOpen && (
            <div className="absolute top-16 left-0 right-0 p-6 rounded-3xl bg-[#0e1014]/95 backdrop-blur-2xl border border-white/10 flex flex-col gap-4 md:hidden z-50 shadow-2xl">
              {links.map((link) => (
                <a
                  key={link}

                  onClick={() => setMobileMenuOpen(false)}
                  className="text-white/80 text-base font-medium py-2 hover:text-white border-b border-white/5"
                >
                  {link}
                </a>
              ))}
              <div className="pt-2">
                <BuildButton label="Build Now" full />
              </div>
            </div>
          )}
        </motion.header>
      );
    };

    const Hero = () => {
      return (
        <section className="relative z-10 pt-36 md:pt-44 pb-16 text-center flex flex-col items-center max-w-5xl mx-auto px-6">
          <motion.h1

            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.8, delay: 0.2, ease: [0.22, 1, 0.36, 1] }}
            className="text-4xl sm:text-6xl md:text-7xl font-semibold tracking-tight leading-[1.02]"
          >
            <div>Instant Previews</div>
            <div className="animate-shiny inline-block mt-2" style={gradientStyle}>
              Built for PwnAI.

          </motion.h1>

          <motion.p

          <motion.div

    const ProjectsSection = () => {
      return (
        <section className="relative z-10 max-w-6xl mx-auto px-6 py-12 md:py-16" id="projects">
          <motion.div 
            initial={{ opacity: 0, y: 30 }}

            className="liquid-glass rounded-3xl p-8 md:p-12 min-h-[420px] flex flex-col items-center justify-center text-center relative overflow-hidden"
          >
            {/* Ambient inner glow */}
            <div

              style={{

            {/* Empty state glass content */}
            <div className="relative z-10 flex flex-col items-center max-w-md">
              <div className="w-16 h-16 rounded-2xl liquid-glass flex items-center justify-center border border-white/10 mb-6 text-white/40">

              <h3 className="text-xl font-medium text-white/90">

              <p className="mt-2 text-sm text-white/40 leading-relaxed mb-6">
                Your PwnAI ecosystem deployments will be isolated and displayed here in real time.
              </p>

              <a 
                href="https://pwnaidev.vercel.app" 
                target="_blank" 
                rel="noopener noreferrer"
                className="group inline-flex items-center justify-center gap-2 rounded-full bg-white text-black font-semibold text-sm px-6 py-3 transition-all hover:bg-white/90 active:scale-[0.98] shadow-lg shadow-white/5"

    const ArchitectureSection = () => {
      const [activeStep, setActiveStep] = useState(0);
      const [copied, setCopied] = useState(false);

      const steps = [
        {
          id: 'dev',
          title: '1. Web App Builder',
          domain: 'pwnaidev.vercel.app',
          icon: 'code-2',
          badge: 'IDE & AI Prompt',
          desc: 'Kullanıcı pwnaidev.vercel.app üzerinde web uygulamasını oluşturur ve "Deploy" butonuna tıklar.',
          highlight: 'Deploy Trigger'
        },
        {
          id: 'build',
          title: '2. Isolated Build Pipeline',
          domain: '',
          icon: 'cpu',
          badge: 'Sandbox Worker',
          desc: 'Otomatik build worker kodu derler, güvenlik ve bağımlılık taramalarını gerçekleştirir.',
          highlight: 'Sandboxed Build'
        },
        {
          id: 'gateway',
          title: '3. Preview Gateway',
          domain: 'pwnreview.vercel.app',
          icon: 'network',
          badge: 'Edge Router',
          desc: 'Dynamic Reverse Proxy isteği yakalar ve ilgili kullanıcı/proje önizleme alanına yönlendirir.',
          highlight: 'Proxy Routing'
        },
        {
          id: 'live',
          title: '4. Dynamic Route Preview',
          domain: 'pwnreview.vercel.app/username/projectname',
          icon: 'globe',
          badge: 'Live URL',
          desc: 'Kullanıcı ve ziyaretçiler /username/projectname URL adresi üzerinden anında canlı önizlemeye erişir.',
          highlight: 'Instant Live'
        }
      ];

      const copyToClipboard = (text) => {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          setCopied(true);
