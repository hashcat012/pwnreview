              return ctx.navigate || function() {};
            },
            useLocation: function() {
              var ctx = (R.useContext && RouterContext) ? R.useContext(RouterContext) : { path: '/' };
              return { pathname: ctx.path, search: '', hash: '' };
            },
            useParams: function() { return {}; },
            useSearchParams: function() { return [new URLSearchParams(), function() {}]; },
            Navigate: function(p) {
              R.useEffect ? R.useEffect(function() { if (p && p.to) window.location.hash = '#' + p.to; }, []) : null;
              return null;
            }
          };
        }

        // Next.js Link & Router Stubs
        if (modName === 'next/link') {
          return function NextLink(p) {
            return R.createElement ? R.createElement('a', Object.assign({ href: p.href || '#' }, p), p.children) : null;
          };
        }
        if (modName === 'next/router' || modName === 'next/navigation') {
          return {
            useRouter: function() { return { push: function() {}, replace: function() {}, pathname: '/' }; },
            usePathname: function() { return '/'; },
            useSearchParams: function() { return new URLSearchParams(); }
          };
        }
        if (modName === 'next/image') {
          return function NextImage(p) {
            return R.createElement ? R.createElement('img', Object.assign({}, p, { src: p.src || '' })) : null;
          };
        }

        if (modName === 'axios') {
          var axiosStub = function(url) { return window.fetch(url).then(function(r) { return r.json(); }).then(function(d) { return { data: d }; }); };
          axiosStub.get = function(url) { return axiosStub(url); };
          axiosStub.post = function(url, data) { return window.fetch(url, { method: 'POST', body: JSON.stringify(data) }).then(function(r) { return r.json(); }).then(function(d) { return { data: d }; }); };
          return axiosStub;
        }

        if (modName === 'canvas-confetti') {
          return window.confetti || function() {};
        }

        // Resolve against project fileMap
        var resolvedKey = resolveFileKey(modName, fromFile);
        if (resolvedKey && fileMap[resolvedKey]) {
          var normTarget = normalizeModPath(resolvedKey);
          if (moduleCache[normTarget]) {
            return moduleCache[normTarget].exports;
          }

          var fileItem = fileMap[resolvedKey];
          var mod = { exports: {} };
          moduleCache[normTarget] = mod;

          try {
            var cleanCode = autoRepairCode(fileItem.content || '', resolvedKey);

            var isTS = resolvedKey.endsWith('.ts') || resolvedKey.endsWith('.tsx');
            var presets = [
              // Target Chrome 80+ — native spread/arrow/const support, only transform modules
              ['env', { modules: 'commonjs', loose: true, targets: { chrome: '80' } }],
              ['react', { runtime: 'classic' }]
            ];
            if (isTS && window.Babel && window.Babel.availablePresets && window.Babel.availablePresets.typescript) {
              presets.unshift(['typescript', { isTSX: true, allExtensions: true }]);
            }

            var res = window.Babel.transform(cleanCode, {
              presets: presets,
              plugins: [],
              filename: resolvedKey
            });

            var scopedRequire = function(reqPath) {
              return requireModule(reqPath, resolvedKey);
            };

            var execFn = new Function(
              'exports', 'require', 'module', 'React', 'ReactDOM',
              'useState', 'useEffect', 'useRef', 'useMemo',
              'useCallback', 'useContext', 'useReducer', 'createContext', 'Fragment',
              '_extends', '_objectSpread', '_interopRequireDefault', '_interopRequireWildcard',
              '_toConsumableArray', '_slicedToArray', '_defineProperty',
              res.code
            );

            execFn(
              mod.exports,
              scopedRequire,
              mod,
              R,
              RD,
              R.useState, R.useEffect, R.useRef, R.useMemo,
              R.useCallback, R.useContext, R.useReducer, R.createContext, R.Fragment,
              window._extends, window._objectSpread, window._interopRequireDefault, window._interopRequireWildcard,
              window._toConsumableArray, window._slicedToArray, window._defineProperty
            );

            if (mod.exports && typeof mod.exports === 'object') {
              mod.exports.__esModule = true;
            }
            return mod.exports;
          } catch (modErr) {
            console.warn('[PWNAI Module Bundler] Module notice "' + resolvedKey + '":', modErr);
            var safeFallbackProxy = new Proxy({}, {
              get: function(_, prop) {
                if (prop === '__esModule') return true;
                if (prop === 'default' || (typeof prop === 'string' && prop.charAt(0) >= 'A' && prop.charAt(0) <= 'Z')) {
                  return function SafeStub(props) {
                    return R.createElement ? R.createElement('div', {
                      style: { padding: '6px 10px', background: 'rgba(239, 68, 68, 0.08)', borderRadius: '6px', color: '#f87171', fontSize: '11px', margin: '4px 0' }
                    }, (props && props.children) || ('[' + String(prop) + ']')) : null;
                  };
                }
                return [];
              }
            });
            mod.exports = safeFallbackProxy;
            return mod.exports;
          }
        }

        // Safe stub for unknown/unresolved modules — callable proxy that never crashes with "... is not a function"
        function createSafeStub(name) {
          var stubFn = function SafeStubCallable() {
            var args = Array.from(arguments);
            if (args.length > 0 && args[0] && typeof args[0] === 'object' && ('children' in args[0] || 'className' in args[0])) {
              return args[0].children || null;
            }

          };
          stubFn.__esModule = true;
          stubFn.default = stubFn;
          return new Proxy(stubFn, {
            get: function(target, prop) {

              if (prop === 'default') return stubFn;

              if (prop === 'then' || prop === 'catch') return undefined;
              return createSafeStub(String(prop));
            }
          });
        }
        return createSafeStub(modName);
      }

      function runProject(rawFiles) {
        if (!rawFiles || !rawFiles.length) return;
        hasReceivedFirstRun = true;

        var loader = document.getElementById('__pwnai_loader');
        if (loader) loader.style.display = 'none';

        moduleCache = {};
        fileMap = {};

        var overlay = document.getElementById('__err_overlay');
        if (overlay) overlay.style.display = 'none';

        waitForDependencies(function() {
          var R = window.React;
          var RD = window.ReactDOM;

          if (!R || !RD) {
            displayError('runtime', 'React Yüklenemedi', 'React ve ReactDOM kütüphaneleri yüklenemedi. Lütfen internet bağlantınızı kontrol edin.');
            return;
          }

          window.useState = R.useState;
          window.useEffect = R.useEffect;
          window.useRef = R.useRef;
          window.useMemo = R.useMemo;
          window.useCallback = R.useCallback;
          window.useContext = R.useContext;
          window.useReducer = R.useReducer;
          window.createContext = R.createContext;
          window.Fragment = R.Fragment;

          try {
            // 1. Process and inject styles (CSS)
            var cssFiles = rawFiles.filter(function(f) { return (f.name || '').endsWith('.css'); });
            var existingStyles = document.querySelectorAll('style[data-pwnai-injected]');
            existingStyles.forEach(function(s) { s.remove(); });

            cssFiles.forEach(function(cf) {
              var styleEl = document.createElement('style');
              styleEl.setAttribute('data-pwnai-injected', 'true');
              styleEl.textContent = cf.content;
              document.head.appendChild(styleEl);
            });

            // 2. Populate fileMap with all files
            rawFiles.forEach(function(f) {
              var n = cleanPath(f.name || '');
              fileMap[n] = f;
            });

            // 3. Locate entry file (App / Main / index)
            var allKeys = Object.keys(fileMap);
            var codeKeys = allKeys.filter(function(k) {
              var n = k.toLowerCase();
              return n.endsWith('.jsx') || n.endsWith('.tsx') || n.endsWith('.js') || n.endsWith('.ts');
            });

            // Exclude helper/data/types files when picking primary entry
            var candidateKeys = codeKeys.filter(function(k) {
              var lower = k.toLowerCase();
              return !(
                lower.indexOf('/data/') !== -1 ||
                lower.indexOf('mockdata') !== -1 ||
                lower.indexOf('/types/') !== -1 ||
                lower.indexOf('/utils/') !== -1 ||
                lower.indexOf('constants') !== -1
              );
            });
            if (candidateKeys.length === 0) candidateKeys = codeKeys;

            var entryFile = null;
            // Exact priority: App.tsx / App.jsx / src/App.tsx / src/App.jsx / Main / Index
            var priorities = [
              'app.tsx', 'app.jsx', 'src/app.tsx', 'src/app.jsx',
              'main.tsx', 'main.jsx', 'src/main.tsx', 'src/main.jsx',
              'index.tsx', 'index.jsx', 'src/index.tsx', 'src/index.jsx',
              'app.js', 'src/app.js', 'main.js', 'src/main.js', 'index.js', 'src/index.js'
            ];

            for (var p = 0; p < priorities.length; p++) {
              for (var c = 0; c < candidateKeys.length; c++) {
                if (cleanPath(candidateKeys[c]).toLowerCase() === priorities[p]) {
                  entryFile = candidateKeys[c];
                  break;
                }
              }
              if (entryFile) break;
            }

            if (!entryFile) {
              for (var a = 0; a < candidateKeys.length; a++) {
                if (candidateKeys[a].toLowerCase().indexOf('app') !== -1) {
                  entryFile = candidateKeys[a];
                  break;
                }
              }
            }

            if (!entryFile && candidateKeys.length > 0) {
              entryFile = candidateKeys[0];
            }

            function resolveComponent(cand) {
              if (!cand) return null;
              if (typeof cand === 'function') return cand;
              if (typeof cand === 'object') {
                if (typeof cand.default === 'function') return cand.default;
                if (cand.$$typeof) return cand;
                if (cand.default && (typeof cand.default === 'object' || typeof cand.default === 'function')) {
                  return resolveComponent(cand.default);
                }
              }
              return null;
            }

            var RootComponent = null;
            if (entryFile) {
              var appExports = requireModule(entryFile, '');
              RootComponent = resolveComponent(appExports.default) || resolveComponent(appExports.App) || resolveComponent(appExports.Main) || resolveComponent(appExports);
            }

            // Fallback search across candidate modules if App not resolved
            if (!RootComponent) {
              candidateKeys.forEach(function(k) {
                if (!RootComponent) {
                  var exp = requireModule(k, '');
                  RootComponent = resolveComponent(exp.default) || resolveComponent(exp.App) || resolveComponent(exp);
                }
              });
            }

            if (RootComponent && (typeof RootComponent === 'function' || typeof RootComponent === 'object')) {
              var rootEl = document.getElementById('root');
              if (RD.createRoot) {
                if (!window.__pwnai_react_root) {
                  window.__pwnai_react_root = RD.createRoot(rootEl);
                }
                window.__pwnai_react_root.render(R.createElement(RootComponent));
              } else {
                RD.render(R.createElement(RootComponent), rootEl);
              }
            } else {
              // Check if HTML file exists
              var htmlFile = rawFiles.find(function(f) { return (f.name || '').endsWith('.html'); });
              if (htmlFile && htmlFile.content) {
                var parser = new DOMParser();
                var doc = parser.parseFromString(htmlFile.content, 'text/html');
                Array.from(doc.head.querySelectorAll('style, link[rel="stylesheet"]')).forEach(function(el) {
                  document.head.appendChild(el.cloneNode(true));
                });
                var rootEl2 = document.getElementById('root');
                if (rootEl2) {
                  rootEl2.innerHTML = doc.body.innerHTML;
                  Array.from(rootEl2.querySelectorAll('script')).forEach(function(oldScript) {
                    var newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(function(attr) {
                      newScript.setAttribute(attr.name, attr.value);
                    });
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                  });
                  return;
                }
              }
              displayError('build', 'Root Bileşen Bulunamadı', 'Projeden dışa aktarılan App bileşeni bulunamadı. Lütfen "export default function App()" tanımlayın.');
            }
          } catch (globalErr) {
            console.error("Global run error:", globalErr);
            displayError('runtime', 'Genel Hata', (globalErr && globalErr.stack) || String(globalErr));
          }
        });
      }

      // Safely decode initial files from the Base64 script payload
      var initialFiles = [];
      try {
        var filesPayloadEl = document.getElementById('__pwnai_initial_files');
        if (filesPayloadEl && filesPayloadEl.textContent) {
          var rawPayload = filesPayloadEl.textContent.trim();
          if (rawPayload) {
            var decodedJson = decodeURIComponent(
              Array.prototype.map
                .call(atob(rawPayload), function(c) {
                  return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                })
                .join('')
            );
            initialFiles = JSON.parse(decodedJson);
          }
        }
      } catch (payloadErr) {
        console.error('[PWNAI] Failed to parse initial files payload:', payloadErr);
      }

      if (initialFiles && initialFiles.length > 0) {
        runProject(initialFiles);
      }

      // Listen for project code updates from parent via Structured Clone postMessage
      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'PWNAI_RUN_PROJECT') {
          runProject(event.data.files);
        }
      });

      // Signal parent that runner is ready immediately
      window.parent.postMessage({ type: 'PWNAI_PREVIEW_READY' }, '*');

      // Handshake polling until first project run to eliminate race conditions
      var readyInterval = setInterval(function() {
        if (hasReceivedFirstRun) {
          clearInterval(readyInterval);
          return;
        }
        window.parent.postMessage({ type: 'PWNAI_PREVIEW_READY' }, '*');
      }, 200);

      window.addEventListener('DOMContentLoaded', function() {
        window.parent.postMessage({ type: 'PWNAI_PREVIEW_READY' }, '*');
      });
      window.addEventListener('load', function() {
        window.parent.postMessage({ type: 'PWNAI_PREVIEW_READY' }, '*');
      });
    })();
  </script>
