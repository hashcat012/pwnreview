              var htmlFile = rawFiles.find(function(f) { return (f.name || '').endsWith('.html'); });
              if (htmlFile && htmlFile.content) {
                var parser = new DOMParser();
                var doc = parser.parseFromString(htmlFile.content, 'text/html');
                Array.from(doc.head.querySelectorAll('style, link[rel="stylesheet"]')).forEach(function(el) {
                  document.head.appendChild(el.cloneNode(true));
                });
                var rootEl2 = document.getElementById('root');
                if (rootEl2) {
                  rootEl2.innerHTML = doc.body.innerHTML;
                  Array.from(rootEl2.querySelectorAll('script')).forEach(function(oldScript) {
                    var newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(function(attr) {
                      newScript.setAttribute(attr.name, attr.value);
                    });
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                  });
                  return;
                }
              }
              displayError('build', 'Root Bileşen Bulunamadı', 'Projeden dışa aktarılan App bileşeni bulunamadı. Lütfen "export default function App()" tanımlayın.');
            }
          } catch (globalErr) {
            console.error("Global run error:", globalErr);
            displayError('runtime', 'Genel Hata', (globalErr && globalErr.stack) || String(globalErr));
          }
        });
      }

      // Safely decode initial files from the Base64 script payload
      var initialFiles = [];
      try {
        var filesPayloadEl = document.getElementById('__pwnai_initial_files');
        if (filesPayloadEl && filesPayloadEl.textContent) {
          var rawPayload = filesPayloadEl.textContent.trim();
          if (rawPayload) {
            var decodedJson = decodeURIComponent(
              Array.prototype.map
                .call(atob(rawPayload), function(c) {
                  return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                })
                .join('')
            );
            initialFiles = JSON.parse(decodedJson);
          }
        }
      } catch (payloadErr) {
        console.error('[PWNAI] Failed to parse initial files payload:', payloadErr);
      }

      if (initialFiles && initialFiles.length > 0) {
        runProject(initialFiles);
      }

      // Listen for project code updates from parent via Structured Clone postMessage
      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'PWNAI_RUN_PROJECT') {
          runProject(event.data.files);
        }
      });

      // Signal parent that runner is ready immediately
      window.parent.postMessage({ type: 'PWNAI_PREVIEW_READY' }, '*');

      // Handshake polling until first project run to eliminate race conditions
      var readyInterval = setInterval(function() {
        if (hasReceivedFirstRun) {
          clearInterval(readyInterval);
          return;
        }
        window.parent.postMessage({ type: 'PWNAI_PREVIEW_READY' }, '*');
      }, 200);

      window.addEventListener('DOMContentLoaded', function() {
        window.parent.postMessage({ type: 'PWNAI_PREVIEW_READY' }, '*');
      });
      window.addEventListener('load', function() {
        window.parent.postMessage({ type: 'PWNAI_PREVIEW_READY' }, '*');
      });
    })();
  </script>
</body>
